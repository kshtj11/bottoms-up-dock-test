<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=540, user-scalable=no">
<title>Gesture Interaction Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #frame {
    position: relative;
    width: 540px;
    height: 620px;
    overflow: hidden;
    background: #373737;
    background: color(display-p3 0.216 0.216 0.216);
  }

  /* Full-screen app view */
  #app-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  #app-screen.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Recents view */
  #recents-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 30;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  #recents-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  #recents-cards {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 40px;
    margin-bottom: 20px;
    overflow: visible;
    transition: transform 0.3s ease;
  }

  .recent-card {
    width: 280px;
    height: 360px;
    border-radius: 16px;
    flex: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .recent-card:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 28px rgba(0,0,0,0.4);
  }

  .recent-card[data-color="#DADADA"] { background: #DADADA; }
  .recent-card[data-color="#BEDE72"] { background: #BEDE72; }
  .recent-card[data-color="#74FFEE"] { background: #74FFEE; }
  .recent-card[data-color="#FFBBBC"] { background: #FFBBBC; }
  .recent-card[data-color="#D4B2FF"] { background: #D4B2FF; }

  /* Recents dock (persistent at bottom of recents view) */
  #recents-dock {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 16px 14px 16px 15px;
    gap: 10px;
    width: 325px;
    height: 76px;
    background: rgba(217, 217, 217, 0.2);
    background: color(display-p3 0.851 0.851 0.851 / 0.2);
    border-radius: 8px;
    margin-bottom: 44px;
  }

  #recents-dock-icons {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 19px;
    width: 296px;
    height: 44px;
  }

  /* The handle */
  #dot-indicator {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 96px;
    height: 48px;
    z-index: 40;
    transition: opacity 0.2s ease;
    pointer-events: auto;
    cursor: grab;
  }

  #dot-indicator.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* App dock (appears on swipe up) */
  #dock-container {
    position: absolute;
    bottom: 44px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 40;
    transform: translateY(120px);
    opacity: 0;
    transition: none;
    pointer-events: none;
  }

  #dock-container.animate {
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  #dock-container.visible {
    transform: translateY(0px);
    opacity: 1;
  }

  #dock {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 16px 14px 16px 15px;
    gap: 10px;
    width: 325px;
    height: 76px;
    background: rgba(217, 217, 217, 0.2);
    background: color(display-p3 0.851 0.851 0.851 / 0.2);
    border-radius: 8px;
  }

  #dock-icons {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 19px;
    width: 296px;
    height: 44px;
  }

  .app-icon {
    width: 44px;
    height: 44px;
    border-radius: 22px;
    flex: none;
    transition: transform 0.15s ease;
    position: relative;
  }

  .app-icon.hovered {
    transform: scale(1.4);
  }

  #icon-search, .icon-search {
    background: #DADADA;
    background: color(display-p3 0.855 0.855 0.855);
    position: relative;
    overflow: visible;
  }

  .search-svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Home screen */
  #home-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .home-icon {
    position: absolute;
    width: 56px;
    height: 56px;
    background: #D9D9D9;
    background: color(display-p3 0.851 0.851 0.851);
    border-radius: 8px;
  }

  #home-label {
    position: absolute;
    width: 276px;
    left: 136px;
    top: 496px;
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-weight: 500;
    font-size: 16px;
    line-height: 19px;
    text-align: center;
    color: #FFFFFF;
    color: color(display-p3 1.000 1.000 1.000);
  }

  .icon-green {
    background: #BEDE72;
    background: color(display-p3 0.769 0.867 0.498);
  }

  .icon-cyan {
    background: #74FFEE;
    background: color(display-p3 0.604 1.000 0.933);
  }

  .icon-pink {
    background: #FFBBBC;
    background: color(display-p3 1.000 0.745 0.745);
  }

  .icon-purple {
    background: #D4B2FF;
    background: color(display-p3 0.812 0.702 1.000);
  }
</style>
</head>
<body>

<div id="frame">
  <!-- Home screen -->
  <div id="home-screen">
    <!-- Row 1: top=88 -->
    <div class="home-icon" style="left:78px;top:88px"></div>
    <div class="home-icon" style="left:187px;top:88px"></div>
    <div class="home-icon" style="left:296px;top:88px"></div>
    <div class="home-icon" style="left:405px;top:88px"></div>
    <!-- Row 2: top=193 -->
    <div class="home-icon" style="left:78px;top:193px"></div>
    <div class="home-icon" style="left:187px;top:193px"></div>
    <div class="home-icon" style="left:296px;top:193px"></div>
    <div class="home-icon" style="left:405px;top:193px"></div>
    <!-- Row 3: top=294 -->
    <div class="home-icon" style="left:78px;top:294px"></div>
    <div class="home-icon" style="left:187px;top:294px"></div>
    <div class="home-icon" style="left:296px;top:294px"></div>
    <div class="home-icon" style="left:405px;top:294px"></div>
    <!-- Row 4: top=399 -->
    <div class="home-icon" style="left:78px;top:399px"></div>
    <div class="home-icon" style="left:187px;top:399px"></div>
    <div class="home-icon" style="left:296px;top:399px"></div>
    <div class="home-icon" style="left:405px;top:399px"></div>
    <div id="home-label">home screen with something and all</div>
  </div>

  <!-- Full screen app view -->
  <div id="app-screen"></div>

  <!-- Recents overlay -->
  <div id="recents-overlay">
    <div id="recents-cards">
      <div class="recent-card" data-color="#DADADA"></div>
      <div class="recent-card" data-color="#BEDE72"></div>
      <div class="recent-card" data-color="#74FFEE"></div>
      <div class="recent-card" data-color="#FFBBBC"></div>
      <div class="recent-card" data-color="#D4B2FF"></div>
    </div>
    <div id="recents-dock">
      <div id="recents-dock-icons">
        <div class="app-icon icon-search" data-color="#DADADA">
          <svg class="search-svg" width="22" height="22" viewBox="0 0 22 22" fill="none">
            <circle cx="9.5" cy="9.5" r="7" stroke="white" stroke-width="2" fill="none"/>
            <line x1="14.5" y1="14.5" x2="20" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="app-icon icon-green" data-color="#BEDE72"></div>
        <div class="app-icon icon-cyan" data-color="#74FFEE"></div>
        <div class="app-icon icon-pink" data-color="#FFBBBC"></div>
        <div class="app-icon icon-purple" data-color="#D4B2FF"></div>
      </div>
    </div>
  </div>

  <!-- Handle -->
  <div id="dot-indicator">
    <svg width="96" height="48" viewBox="0 0 96 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path opacity="0.44" d="M48 0C74.5097 0 96 21.4903 96 48H0C0 21.4903 21.4903 0 48 0Z" fill="#4A4A4A" style="fill:#4A4A4A;fill:color(display-p3 0.2885 0.2885 0.2885);fill-opacity:1;"/>
      <path d="M48 18C64.5685 18 78 31.4315 78 48H18C18 31.4315 31.4315 18 48 18Z" fill="#D9D9D9" style="fill:#D9D9D9;fill:color(display-p3 0.8510 0.8510 0.8510);fill-opacity:1;"/>
    </svg>
  </div>

  <!-- Dock (swipe-up) -->
  <div id="dock-container">
    <div id="dock">
      <div id="dock-icons">
        <div class="app-icon icon-search" id="icon-search" data-color="#DADADA">
          <svg class="search-svg" width="22" height="22" viewBox="0 0 22 22" fill="none">
            <circle cx="9.5" cy="9.5" r="7" stroke="white" stroke-width="2" fill="none"/>
            <line x1="14.5" y1="14.5" x2="20" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="app-icon icon-green" id="icon-green" data-color="#BEDE72"></div>
        <div class="app-icon icon-cyan" id="icon-cyan" data-color="#74FFEE"></div>
        <div class="app-icon icon-pink" id="icon-pink" data-color="#FFBBBC"></div>
        <div class="app-icon icon-purple" id="icon-purple" data-color="#D4B2FF"></div>
      </div>
    </div>
  </div>
</div>

<script>
const frame = document.getElementById('frame');
const dotIndicator = document.getElementById('dot-indicator');
const dockContainer = document.getElementById('dock-container');
const appScreen = document.getElementById('app-screen');
const appIcons = document.querySelectorAll('#dock-icons .app-icon');
const recentsOverlay = document.getElementById('recents-overlay');
const recentsCards = document.getElementById('recents-cards');
const recentCardEls = document.querySelectorAll('.recent-card');
const recentsDockIcons = document.querySelectorAll('#recents-dock-icons .app-icon');

let state = 'idle'; // idle | dragging | recents | app-open
let dragStartY = 0;
let currentHovered = null;
let peakDy = 0; // track highest point of drag
let recentsCardIndex = 0;

// Handle drag
dotIndicator.addEventListener('pointerdown', (e) => {
  if (state !== 'idle' && state !== 'app-open') return;
  e.preventDefault();

  const wasAppOpen = state === 'app-open';
  state = 'dragging';
  dragStartY = e.clientY;
  peakDy = 0;

  dotIndicator.classList.add('hidden');
  dockContainer.classList.remove('animate');
  void dockContainer.offsetWidth;
  dockContainer.classList.add('visible');

  frame.setPointerCapture(e.pointerId);

  const onMove = (e2) => {
    if (state !== 'dragging') return;
    const dy = dragStartY - e2.clientY;
    if (dy > peakDy) peakDy = dy;

    // Hit-test dock icons
    const frameRect = frame.getBoundingClientRect();
    const pointerX = e2.clientX - frameRect.left;
    const pointerY = e2.clientY - frameRect.top;

    let hoveredIcon = null;
    appIcons.forEach(icon => {
      const rect = icon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2 - frameRect.left;
      const cy = rect.top + rect.height / 2 - frameRect.top;
      const dist = Math.sqrt((pointerX - cx) ** 2 + (pointerY - cy) ** 2);
      if (dist < 30) hoveredIcon = icon;
    });

    if (currentHovered && currentHovered !== hoveredIcon) {
      currentHovered.classList.remove('hovered');
    }
    if (hoveredIcon) {
      hoveredIcon.classList.add('hovered');
    }
    currentHovered = hoveredIcon;
  };

  const onUp = (e2) => {
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);

    const dy = dragStartY - e2.clientY;

    if (currentHovered) {
      // Released on a dock icon → open that app
      const color = currentHovered.dataset.color;
      openApp(color);
      currentHovered.classList.remove('hovered');
      currentHovered = null;
      hideDock();
    } else if (peakDy > 25 && dy < peakDy * 0.4) {
      // Swiped up then came back down → dismiss
      hideDock();
      dotIndicator.classList.remove('hidden');
      state = wasAppOpen ? 'app-open' : 'idle';
    } else if (dy > 300) {
      // Very high swipe → go home
      hideDock();
      goHome();
    } else if (dy > 25) {
      // Released up without hitting icon → show recents
      hideDock();
      showRecents();
    } else {
      // Barely moved → dismiss
      hideDock();
      dotIndicator.classList.remove('hidden');
      state = wasAppOpen ? 'app-open' : 'idle';
    }
  };

  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
});

function openApp(color) {
  appScreen.style.background = color;
  appScreen.classList.add('open');
  dotIndicator.classList.remove('hidden');
  state = 'app-open';
}

function goHome() {
  appScreen.classList.remove('open');
  recentsOverlay.classList.remove('visible');
  dotIndicator.classList.remove('hidden');
  state = 'idle';
}

function hideDock() {
  dockContainer.classList.add('animate');
  dockContainer.classList.remove('visible');
}

function showRecents() {
  state = 'recents';
  recentsCardIndex = 0;
  updateRecentsPosition(true);
  recentsOverlay.classList.add('visible');
  dotIndicator.classList.remove('hidden');

  // Close any open app behind
  appScreen.classList.remove('open');
}

function hideRecents() {
  recentsOverlay.classList.remove('visible');
  dotIndicator.classList.remove('hidden');
  state = 'idle';
}

function updateRecentsPosition(animate) {
  const cardW = 280;
  const gap = 16;
  const offset = -(recentsCardIndex * (cardW + gap));
  recentsCards.style.transition = animate ? 'transform 0.3s ease' : 'none';
  recentsCards.style.transform = `translateX(${offset}px)`;
}

// Horizontal swiping in recents view
let recentsDragStartX = 0;
let recentsDragging = false;

recentsOverlay.addEventListener('pointerdown', (e) => {
  if (state !== 'recents') return;
  // Check if tapped on a card
  const card = e.target.closest('.recent-card');
  const dockIcon = e.target.closest('#recents-dock-icons .app-icon');

  recentsDragStartX = e.clientX;
  recentsDragging = true;
  recentsOverlay.setPointerCapture(e.pointerId);

  const onMove = (e2) => {
    if (!recentsDragging) return;
    const dx = e2.clientX - recentsDragStartX;
    const cardW = 280;
    const gap = 16;
    const baseOffset = -(recentsCardIndex * (cardW + gap));
    recentsCards.style.transition = 'none';
    recentsCards.style.transform = `translateX(${baseOffset + dx}px)`;
  };

  const onUp = (e2) => {
    recentsOverlay.removeEventListener('pointermove', onMove);
    recentsOverlay.removeEventListener('pointerup', onUp);
    recentsDragging = false;

    const dx = e2.clientX - recentsDragStartX;

    if (Math.abs(dx) < 10) {
      // It was a tap
      if (card) {
        const color = card.dataset.color;
        hideRecents();
        openApp(color);
        return;
      }
      if (dockIcon) {
        const color = dockIcon.dataset.color;
        hideRecents();
        openApp(color);
        return;
      }
      // Tapped on background → dismiss recents
      hideRecents();
      return;
    }

    // Swipe to change card
    const threshold = 80;
    if (dx < -threshold && recentsCardIndex < recentCardEls.length - 1) {
      recentsCardIndex++;
    } else if (dx > threshold && recentsCardIndex > 0) {
      recentsCardIndex--;
    }
    updateRecentsPosition(true);
  };

  recentsOverlay.addEventListener('pointermove', onMove);
  recentsOverlay.addEventListener('pointerup', onUp);
});
</script>

</body>
</html>
