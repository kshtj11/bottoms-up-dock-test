<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=540, user-scalable=no">
<title>Gesture Interaction Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #frame {
    position: relative;
    width: 540px;
    height: 620px;
    overflow: hidden;
    background: #373737;
    background: color(display-p3 0.216 0.216 0.216);
  }

  /* Home screen */
  #home-screen {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .home-icon {
    position: absolute;
    width: 56px;
    height: 56px;
    background: #D9D9D9;
    background: color(display-p3 0.851 0.851 0.851);
    border-radius: 8px;
  }
  #home-label {
    position: absolute;
    width: 276px;
    left: 136px;
    top: 496px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 19px;
    text-align: center;
    color: #FFFFFF;
  }

  /* Full-screen opened app */
  #app-screen {
    position: absolute;
    inset: 0;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #app-screen.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Recent apps preview (Frame 36) */
  #recents-preview {
    position: absolute;
    top: 113px;
    left: 0;
    width: 540px;
    height: 372px;
    z-index: 10;
    display: flex;
    justify-content: center;
    overflow: visible;
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #recents-preview.visible {
    opacity: 1;
    transform: scale(1);
  }
  #recents-track {
    display: flex;
    gap: 44px;
    align-items: center;
  }
  .preview-card {
    width: 324px;
    height: 372px;
    border-radius: 22px;
    flex: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }

  /* Dock (Frame 5) */
  #dock {
    position: absolute;
    left: 50%;
    bottom: 26px; /* 16px deadzone + 10px gap */
    transform: translateX(-50%) translateY(140px);
    width: 349px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 14px 0 15px;
    background: rgba(217, 217, 217, 0.2);
    background: color(display-p3 0.851 0.851 0.851 / 0.2);
    border-radius: 40px;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.28s cubic-bezier(0.22,1,0.36,1), opacity 0.2s ease;
  }
  #dock.revealed {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  #dock-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 24px;
    width: 320px;
    height: 64px;
  }

  .dock-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: width 0.18s cubic-bezier(0.22,1,0.36,1), height 0.18s cubic-bezier(0.22,1,0.36,1);
    position: relative;
  }
  .dock-icon.active {
    width: 64px;
    height: 64px;
  }

  .icon-search { background: #DADADA; background: color(display-p3 0.855 0.855 0.855); }
  .icon-green  { background: #BEDE72; background: color(display-p3 0.769 0.867 0.498); }
  .icon-cyan   { background: #74FFEE; background: color(display-p3 0.604 1.000 0.933); }
  .icon-pink   { background: #FFBBBC; background: color(display-p3 1.000 0.745 0.745); }
  .icon-purple { background: #D4B2FF; background: color(display-p3 0.812 0.702 1.000); }

  .search-svg {
    width: 22px;
    height: 22px;
    transition: transform 0.18s ease;
  }
  .dock-icon.active .search-svg {
    transform: scale(1.3);
  }

  /* Deadzone (Rectangle 37) */
  #deadzone {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 16px;
    background: #111111;
    background: color(display-p3 0.067 0.067 0.067);
    z-index: 30;
    cursor: grab;
  }
</style>
</head>
<body>

<div id="frame">
  <!-- Home screen -->
  <div id="home-screen">
    <div class="home-icon" style="left:78px;top:88px"></div>
    <div class="home-icon" style="left:187px;top:88px"></div>
    <div class="home-icon" style="left:296px;top:88px"></div>
    <div class="home-icon" style="left:405px;top:88px"></div>
    <div class="home-icon" style="left:78px;top:193px"></div>
    <div class="home-icon" style="left:187px;top:193px"></div>
    <div class="home-icon" style="left:296px;top:193px"></div>
    <div class="home-icon" style="left:405px;top:193px"></div>
    <div class="home-icon" style="left:78px;top:294px"></div>
    <div class="home-icon" style="left:187px;top:294px"></div>
    <div class="home-icon" style="left:296px;top:294px"></div>
    <div class="home-icon" style="left:405px;top:294px"></div>
    <div class="home-icon" style="left:78px;top:399px"></div>
    <div class="home-icon" style="left:187px;top:399px"></div>
    <div class="home-icon" style="left:296px;top:399px"></div>
    <div class="home-icon" style="left:405px;top:399px"></div>
    <div id="home-label">home screen with something and all</div>
  </div>

  <!-- Opened app -->
  <div id="app-screen"></div>

  <!-- Recent apps preview -->
  <div id="recents-preview">
    <div id="recents-track"></div>
  </div>

  <!-- Dock -->
  <div id="dock">
    <div id="dock-row">
      <div class="dock-icon icon-search" data-app="search">
        <svg class="search-svg" viewBox="0 0 22 22" fill="none">
          <circle cx="9.5" cy="9.5" r="7" stroke="white" stroke-width="2" fill="none"/>
          <line x1="14.5" y1="14.5" x2="20" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="dock-icon icon-green" data-app="green"></div>
      <div class="dock-icon icon-cyan active" data-app="recent"></div>
      <div class="dock-icon icon-pink" data-app="pink"></div>
      <div class="dock-icon icon-purple" data-app="purple"></div>
    </div>
  </div>

  <!-- Deadzone -->
  <div id="deadzone"></div>
</div>

<script>
const frame = document.getElementById('frame');
const deadzone = document.getElementById('deadzone');
const dock = document.getElementById('dock');
const dockIcons = Array.from(document.querySelectorAll('.dock-icon'));
const appScreen = document.getElementById('app-screen');
const recentsPreview = document.getElementById('recents-preview');
const recentsTrack = document.getElementById('recents-track');

// App color map for full-screen open
const APP_COLORS = {
  search: '#DADADA',
  green:  '#BEDE72',
  pink:   '#FFBBBC',
  purple: '#D4B2FF'
};

// Recent apps stack — index 0 is most recent (shown in middle of preview)
let recents = ['#E8A87C', '#85CDCA', '#C38D9E'];

function buildRecentsPreview() {
  recentsTrack.innerHTML = '';
  // Show up to 3: [second, mostRecent(center), third]
  const order = [];
  if (recents.length >= 1) {
    // center = recents[0]; neighbors fill sides
    const center = recents[0];
    const left = recents[1] || recents[0];
    const right = recents[2] || recents[1] || recents[0];
    order.push(left, center, right);
  }
  order.forEach((color, i) => {
    const card = document.createElement('div');
    card.className = 'preview-card';
    card.style.background = color;
    card.dataset.color = color;
    // Tapping a card (when recents are latched open) opens that app
    card.addEventListener('pointerdown', (ev) => {
      if (!recentsLatched) return;
      ev.stopPropagation();
      unlatchRecents();
      openApp(color, true);
    });
    recentsTrack.appendChild(card);
  });
}

const RECENT_INDEX = 2; // center cyan icon position in dockIcons

const FRAME_H = 620;

let dragging = false;
let revealed = false;
let recentsLatched = false; // recents view kept open after release
let activeIndex = RECENT_INDEX;
let startY = 0;
let lastY = 0;
let crossedMiddle = false;

function setActive(index) {
  if (index === activeIndex) return;
  dockIcons[activeIndex].classList.remove('active');
  dockIcons[index].classList.add('active');
  activeIndex = index;

  // Recents preview only shows when the recent (center) icon is active
  if (activeIndex === RECENT_INDEX) {
    recentsPreview.classList.add('visible');
  } else {
    recentsPreview.classList.remove('visible');
  }
}

function nearestIconIndex(pointerX) {
  let best = 0;
  let bestDist = Infinity;
  dockIcons.forEach((icon, i) => {
    const r = icon.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const d = Math.abs(pointerX - cx);
    if (d < bestDist) { bestDist = d; best = i; }
  });
  return best;
}

deadzone.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  dragging = true;
  revealed = false;
  recentsLatched = false;
  crossedMiddle = false;
  startY = e.clientY;
  lastY = e.clientY;

  // Reset active to center (recent) by default
  dockIcons.forEach(ic => ic.classList.remove('active'));
  activeIndex = RECENT_INDEX;
  dockIcons[RECENT_INDEX].classList.add('active');

  buildRecentsPreview();
  frame.setPointerCapture(e.pointerId);

  const onMove = (e2) => {
    if (!dragging) return;
    lastY = e2.clientY;
    const dy = startY - e2.clientY;

    if (dy > 8 && !revealed) {
      revealed = true;
      dock.classList.add('revealed');
      recentsPreview.classList.add('visible');
    }

    // Did the swipe reach past the middle of the screen?
    const fr = frame.getBoundingClientRect();
    if ((e2.clientY - fr.top) < FRAME_H / 2) crossedMiddle = true;

    if (revealed) {
      const idx = nearestIconIndex(e2.clientX);
      setActive(idx);
    }
  };

  const onUp = (e2) => {
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    dragging = false;

    const onRecentIcon = activeIndex === RECENT_INDEX;

    if (revealed && (onRecentIcon || crossedMiddle)) {
      // Keep the recent apps view open
      latchRecents();
    } else if (revealed) {
      openActive();
      collapseDock();
    } else {
      collapseDock();
    }
  };

  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
});

function collapseDock() {
  dock.classList.remove('revealed');
  if (!recentsLatched) recentsPreview.classList.remove('visible');
}

function latchRecents() {
  recentsLatched = true;
  dock.classList.remove('revealed');
  recentsPreview.classList.add('visible');
}

function unlatchRecents() {
  recentsLatched = false;
  recentsPreview.classList.remove('visible');
}

function openActive() {
  const app = dockIcons[activeIndex].dataset.app;
  let color;
  if (app === 'recent') {
    color = recents[0]; // most recent
  } else {
    color = APP_COLORS[app];
  }
  openApp(color, app !== 'recent');
}

function openApp(color, addToRecents) {
  if (addToRecents) {
    recents = recents.filter(c => c !== color);
    recents.unshift(color);
  }
  appScreen.style.background = color;
  appScreen.classList.add('open');
}

// Tap on opened app to go home
appScreen.addEventListener('pointerdown', (e) => {
  // only dismiss if tap is not in the deadzone region (handled separately)
  if (e.clientY) {
    const r = frame.getBoundingClientRect();
    const yInFrame = e.clientY - r.top;
    if (yInFrame < 604) { // above deadzone
      appScreen.classList.remove('open');
    }
  }
});

// Tap anywhere outside the cards (while recents are latched) to dismiss
frame.addEventListener('pointerdown', (e) => {
  if (!recentsLatched || dragging) return;
  if (e.target.closest('.preview-card')) return; // card handles its own tap
  if (e.target.closest('#deadzone')) return;     // deadzone starts a new gesture
  unlatchRecents();
});

buildRecentsPreview();
</script>

</body>
</html>
