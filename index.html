<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=540, user-scalable=no">
<title>Gesture Interaction Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #frame {
    position: relative;
    width: 540px;
    height: 620px;
    overflow: hidden;
  }

  /* Horizontal screen strip */
  #screen-strip {
    display: flex;
    width: max-content;
    height: 100%;
    transition: transform 0.3s ease;
  }

  .screen {
    width: 540px;
    height: 620px;
    flex: none;
  }

  #screen-home {
    background: #373737;
    background: color(display-p3 0.216 0.216 0.216);
  }
  #screen-search {
    background: #DADADA;
    background: color(display-p3 0.855 0.855 0.855);
  }
  #screen-green {
    background: #BEDE72;
    background: color(display-p3 0.769 0.867 0.498);
  }
  #screen-cyan {
    background: #74FFEE;
    background: color(display-p3 0.604 1.000 0.933);
  }
  #screen-pink {
    background: #FFBBBC;
    background: color(display-p3 1.000 0.745 0.745);
  }
  #screen-purple {
    background: #D4B2FF;
    background: color(display-p3 0.812 0.702 1.000);
  }

  /* Bottom swipe detection bar */
  #swipe-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 24px;
    background: #000;
    z-index: 10;
  }

  /* The handle */
  #dot-indicator {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 96px;
    height: 48px;
    z-index: 15;
    transition: opacity 0.2s ease;
    pointer-events: auto;
    cursor: grab;
  }

  #dot-indicator.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* App dock */
  #dock-container {
    position: absolute;
    bottom: 44px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 20;
    transform: translateY(120px);
    opacity: 0;
    transition: none;
    pointer-events: none;
  }

  #dock-container.animate {
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  #dock-container.visible {
    transform: translateY(0px);
    opacity: 1;
  }

  #dock {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 16px 14px 16px 15px;
    gap: 10px;
    width: 325px;
    height: 76px;
    background: rgba(217, 217, 217, 0.2);
    background: color(display-p3 0.851 0.851 0.851 / 0.2);
    border-radius: 8px;
  }

  #dock-icons {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 19px;
    width: 296px;
    height: 44px;
  }

  .app-icon {
    width: 44px;
    height: 44px;
    border-radius: 22px;
    flex: none;
    transition: transform 0.15s ease;
    position: relative;
  }

  .app-icon.hovered {
    transform: scale(1.4);
  }

  #icon-search {
    background: #DADADA;
    background: color(display-p3 0.855 0.855 0.855);
    position: relative;
    overflow: visible;
  }

  #icon-search svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  #icon-green {
    background: #BEDE72;
    background: color(display-p3 0.769 0.867 0.498);
  }

  #icon-cyan {
    background: #74FFEE;
    background: color(display-p3 0.604 1.000 0.933);
  }

  #icon-pink {
    background: #FFBBBC;
    background: color(display-p3 1.000 0.745 0.745);
  }

  #icon-purple {
    background: #D4B2FF;
    background: color(display-p3 0.812 0.702 1.000);
  }
</style>
</head>
<body>

<div id="frame">
  <div id="screen-strip">
    <div class="screen" id="screen-home"></div>
    <div class="screen" id="screen-search"></div>
    <div class="screen" id="screen-green"></div>
    <div class="screen" id="screen-cyan"></div>
    <div class="screen" id="screen-pink"></div>
    <div class="screen" id="screen-purple"></div>
  </div>

  <div id="swipe-bar"></div>

  <div id="dot-indicator">
    <svg width="96" height="48" viewBox="0 0 96 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path opacity="0.44" d="M48 0C74.5097 0 96 21.4903 96 48H0C0 21.4903 21.4903 0 48 0Z" fill="#4A4A4A" style="fill:#4A4A4A;fill:color(display-p3 0.2885 0.2885 0.2885);fill-opacity:1;"/>
      <path d="M48 18C64.5685 18 78 31.4315 78 48H18C18 31.4315 31.4315 18 48 18Z" fill="#D9D9D9" style="fill:#D9D9D9;fill:color(display-p3 0.8510 0.8510 0.8510);fill-opacity:1;"/>
    </svg>
  </div>

  <div id="dock-container">
    <div id="dock">
      <div id="dock-icons">
        <div class="app-icon" id="icon-search" data-screen="1">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <circle cx="9.5" cy="9.5" r="7" stroke="white" stroke-width="2" fill="none"/>
            <line x1="14.5" y1="14.5" x2="20" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="app-icon" id="icon-green" data-screen="2"></div>
        <div class="app-icon" id="icon-cyan" data-screen="3"></div>
        <div class="app-icon" id="icon-pink" data-screen="4"></div>
        <div class="app-icon" id="icon-purple" data-screen="5"></div>
      </div>
    </div>
  </div>
</div>

<script>
const frame = document.getElementById('frame');
const strip = document.getElementById('screen-strip');
const dotIndicator = document.getElementById('dot-indicator');
const dockContainer = document.getElementById('dock-container');
const appIcons = document.querySelectorAll('.app-icon');

const SCREEN_W = 540;
const SCREEN_COUNT = 6;
let currentScreen = 0;
let state = 'idle';
let dragStartX = 0;
let dragStartY = 0;
let dragDirection = null; // 'horizontal' | 'vertical' | null
let currentHovered = null;

function goToScreen(index, animate) {
  currentScreen = Math.max(0, Math.min(SCREEN_COUNT - 1, index));
  if (animate) {
    strip.style.transition = 'transform 0.3s ease';
  } else {
    strip.style.transition = 'none';
  }
  strip.style.transform = `translateX(${-currentScreen * SCREEN_W}px)`;
}

dotIndicator.addEventListener('pointerdown', (e) => {
  if (state !== 'idle') return;
  e.preventDefault();
  state = 'dragging';
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragDirection = null;

  strip.style.transition = 'none';
  frame.setPointerCapture(e.pointerId);

  const onMove = (e2) => {
    if (state !== 'dragging') return;
    const dx = e2.clientX - dragStartX;
    const dy = dragStartY - e2.clientY;

    if (!dragDirection) {
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
        dragDirection = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
        if (dragDirection === 'vertical' && dy > 0) {
          dotIndicator.classList.add('hidden');
          dockContainer.classList.remove('animate');
          void dockContainer.offsetWidth;
          dockContainer.classList.add('visible');
        }
      }
      return;
    }

    if (dragDirection === 'horizontal') {
      const offset = -currentScreen * SCREEN_W + dx;
      strip.style.transform = `translateX(${offset}px)`;
    }

    if (dragDirection === 'vertical') {
      const frameRect = frame.getBoundingClientRect();
      const pointerX = e2.clientX - frameRect.left;
      const pointerY = e2.clientY - frameRect.top;

      let hoveredIcon = null;
      appIcons.forEach(icon => {
        const rect = icon.getBoundingClientRect();
        const iconCenterX = rect.left + rect.width / 2 - frameRect.left;
        const iconCenterY = rect.top + rect.height / 2 - frameRect.top;
        const dist = Math.sqrt((pointerX - iconCenterX) ** 2 + (pointerY - iconCenterY) ** 2);
        if (dist < 30) hoveredIcon = icon;
      });

      if (currentHovered && currentHovered !== hoveredIcon) {
        currentHovered.classList.remove('hovered');
      }
      if (hoveredIcon) {
        hoveredIcon.classList.add('hovered');
      }
      currentHovered = hoveredIcon;
    }
  };

  const onUp = (e2) => {
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);

    if (dragDirection === 'horizontal') {
      const dx = e2.clientX - dragStartX;
      const threshold = SCREEN_W * 0.2;
      let target = currentScreen;
      if (dx < -threshold) target = currentScreen + 1;
      else if (dx > threshold) target = currentScreen - 1;
      goToScreen(target, true);
    }

    if (dragDirection === 'vertical') {
      if (currentHovered) {
        const screenIndex = parseInt(currentHovered.dataset.screen);
        dockContainer.classList.add('animate');
        dockContainer.classList.remove('visible');
        dotIndicator.classList.remove('hidden');
        goToScreen(screenIndex, true);
        currentHovered.classList.remove('hovered');
        currentHovered = null;
      } else {
        dockContainer.classList.add('animate');
        dockContainer.classList.remove('visible');
        dotIndicator.classList.remove('hidden');
      }
    }

    if (!dragDirection) {
      dotIndicator.classList.remove('hidden');
    }

    state = 'idle';
    dragDirection = null;
  };

  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
});

goToScreen(0, false);
</script>

</body>
</html>
