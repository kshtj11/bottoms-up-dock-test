<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=540, user-scalable=no">
<title>Gesture Interaction Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #frame {
    position: relative;
    width: 540px;
    height: 620px;
    overflow: hidden;
    background: #373737;
    background: color(display-p3 0.216 0.216 0.216);
  }

  /* Full-screen app view */
  #app-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  #app-screen.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Recents view */
  #recents-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 30;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  #recents-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  #recents-empty {
    color: rgba(255,255,255,0.4);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    margin-bottom: 180px;
  }

  #recents-cards {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 40px;
    margin-bottom: 20px;
    overflow: visible;
    transition: transform 0.3s ease;
  }

  .recent-card {
    width: 280px;
    height: 360px;
    border-radius: 16px;
    flex: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .recent-card:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 28px rgba(0,0,0,0.4);
  }

  /* Recents dock */
  #recents-dock {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 16px 14px 16px 15px;
    gap: 10px;
    width: 325px;
    height: 76px;
    background: rgba(217, 217, 217, 0.2);
    background: color(display-p3 0.851 0.851 0.851 / 0.2);
    border-radius: 8px;
    margin-bottom: 44px;
  }

  #recents-dock-icons {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 19px;
    width: 296px;
    height: 44px;
  }

  /* The handle */
  #dot-indicator {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 96px;
    height: 48px;
    z-index: 40;
    transition: opacity 0.2s ease;
    pointer-events: auto;
    cursor: grab;
  }

  #dot-indicator.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* App dock (appears on swipe up) */
  #dock-container {
    position: absolute;
    bottom: 44px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 40;
    transform: translateY(120px);
    opacity: 0;
    transition: none;
    pointer-events: none;
  }

  #dock-container.animate {
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  #dock-container.visible {
    transform: translateY(0px);
    opacity: 1;
  }

  #dock {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 16px 14px 16px 15px;
    gap: 10px;
    width: 325px;
    height: 76px;
    background: rgba(217, 217, 217, 0.2);
    background: color(display-p3 0.851 0.851 0.851 / 0.2);
    border-radius: 8px;
  }

  #dock-icons {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 19px;
    width: 296px;
    height: 44px;
  }

  .app-icon {
    width: 44px;
    height: 44px;
    border-radius: 22px;
    flex: none;
    transition: transform 0.15s ease;
    position: relative;
  }

  .app-icon.hovered {
    transform: scale(1.4);
  }

  .search-svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Home screen */
  #home-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .home-icon {
    position: absolute;
    width: 56px;
    height: 56px;
    background: #D9D9D9;
    background: color(display-p3 0.851 0.851 0.851);
    border-radius: 8px;
  }

  #home-label {
    position: absolute;
    width: 276px;
    left: 136px;
    top: 496px;
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-weight: 500;
    font-size: 16px;
    line-height: 19px;
    text-align: center;
    color: #FFFFFF;
    color: color(display-p3 1.000 1.000 1.000);
  }
</style>
</head>
<body>

<div id="frame">
  <!-- Home screen -->
  <div id="home-screen">
    <div class="home-icon" style="left:78px;top:88px"></div>
    <div class="home-icon" style="left:187px;top:88px"></div>
    <div class="home-icon" style="left:296px;top:88px"></div>
    <div class="home-icon" style="left:405px;top:88px"></div>
    <div class="home-icon" style="left:78px;top:193px"></div>
    <div class="home-icon" style="left:187px;top:193px"></div>
    <div class="home-icon" style="left:296px;top:193px"></div>
    <div class="home-icon" style="left:405px;top:193px"></div>
    <div class="home-icon" style="left:78px;top:294px"></div>
    <div class="home-icon" style="left:187px;top:294px"></div>
    <div class="home-icon" style="left:296px;top:294px"></div>
    <div class="home-icon" style="left:405px;top:294px"></div>
    <div class="home-icon" style="left:78px;top:399px"></div>
    <div class="home-icon" style="left:187px;top:399px"></div>
    <div class="home-icon" style="left:296px;top:399px"></div>
    <div class="home-icon" style="left:405px;top:399px"></div>
    <div id="home-label">home screen with something and all</div>
  </div>

  <!-- Full screen app view -->
  <div id="app-screen"></div>

  <!-- Recents overlay -->
  <div id="recents-overlay">
    <div id="recents-empty">No recent apps</div>
    <div id="recents-cards"></div>
    <div id="recents-dock">
      <div id="recents-dock-icons">
        <div class="app-icon" data-color="#DADADA" style="background:#DADADA">
          <svg class="search-svg" width="22" height="22" viewBox="0 0 22 22" fill="none">
            <circle cx="9.5" cy="9.5" r="7" stroke="white" stroke-width="2" fill="none"/>
            <line x1="14.5" y1="14.5" x2="20" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="app-icon" data-color="#FF9F43" style="background:#FF9F43"></div>
        <div class="app-icon" data-color="#54A0FF" style="background:#54A0FF"></div>
        <div class="app-icon" data-color="#FF6B6B" style="background:#FF6B6B"></div>
        <div class="app-icon" data-color="#1DD1A1" style="background:#1DD1A1"></div>
      </div>
    </div>
  </div>

  <!-- Handle -->
  <div id="dot-indicator">
    <svg width="96" height="48" viewBox="0 0 96 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path opacity="0.44" d="M48 0C74.5097 0 96 21.4903 96 48H0C0 21.4903 21.4903 0 48 0Z" fill="#4A4A4A" style="fill:#4A4A4A;fill:color(display-p3 0.2885 0.2885 0.2885);fill-opacity:1;"/>
      <path d="M48 18C64.5685 18 78 31.4315 78 48H18C18 31.4315 31.4315 18 48 18Z" fill="#D9D9D9" style="fill:#D9D9D9;fill:color(display-p3 0.8510 0.8510 0.8510);fill-opacity:1;"/>
    </svg>
  </div>

  <!-- Dock (swipe-up quick access) -->
  <div id="dock-container">
    <div id="dock">
      <div id="dock-icons">
        <div class="app-icon" id="icon-search" data-color="#DADADA" style="background:#DADADA">
          <svg class="search-svg" width="22" height="22" viewBox="0 0 22 22" fill="none">
            <circle cx="9.5" cy="9.5" r="7" stroke="white" stroke-width="2" fill="none"/>
            <line x1="14.5" y1="14.5" x2="20" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="app-icon" data-color="#FF9F43" style="background:#FF9F43"></div>
        <div class="app-icon" data-color="#54A0FF" style="background:#54A0FF"></div>
        <div class="app-icon" data-color="#FF6B6B" style="background:#FF6B6B"></div>
        <div class="app-icon" data-color="#1DD1A1" style="background:#1DD1A1"></div>
      </div>
    </div>
  </div>
</div>

<script>
const frame = document.getElementById('frame');
const dotIndicator = document.getElementById('dot-indicator');
const dockContainer = document.getElementById('dock-container');
const appScreen = document.getElementById('app-screen');
const appIcons = document.querySelectorAll('#dock-icons .app-icon');
const recentsOverlay = document.getElementById('recents-overlay');
const recentsCards = document.getElementById('recents-cards');
const recentsEmpty = document.getElementById('recents-empty');

let state = 'idle'; // idle | dragging | recents | app-open
let dragStartY = 0;
let currentHovered = null;
let peakDy = 0;
let recentsCardIndex = 0;

// Running apps stack (most recent first)
let runningApps = [];

function addToRunning(color) {
  // Remove if already exists (move to front)
  runningApps = runningApps.filter(c => c !== color);
  runningApps.unshift(color);
  rebuildRecentsCards();
}

function rebuildRecentsCards() {
  recentsCards.innerHTML = '';
  if (runningApps.length === 0) {
    recentsEmpty.style.display = '';
    return;
  }
  recentsEmpty.style.display = 'none';
  runningApps.forEach(color => {
    const card = document.createElement('div');
    card.className = 'recent-card';
    card.dataset.color = color;
    card.style.background = color;
    recentsCards.appendChild(card);
  });
}

// Handle drag
dotIndicator.addEventListener('pointerdown', (e) => {
  if (state !== 'idle' && state !== 'app-open') return;
  e.preventDefault();

  const wasAppOpen = state === 'app-open';
  state = 'dragging';
  dragStartY = e.clientY;
  peakDy = 0;

  dotIndicator.classList.add('hidden');
  dockContainer.classList.remove('animate');
  void dockContainer.offsetWidth;
  dockContainer.classList.add('visible');

  frame.setPointerCapture(e.pointerId);

  let recentsShown = false;

  const onMove = (e2) => {
    if (state !== 'dragging') return;
    const dy = dragStartY - e2.clientY;
    if (dy > peakDy) peakDy = dy;

    // Show recents as soon as threshold is crossed
    if (dy > 100 && !recentsShown) {
      recentsShown = true;
      showRecents();
    }

    // Hide recents if dragged back down
    if (recentsShown && dy < 60) {
      recentsShown = false;
      recentsOverlay.classList.remove('visible');
    }

    // Hit-test dock icons
    const frameRect = frame.getBoundingClientRect();
    const pointerX = e2.clientX - frameRect.left;
    const pointerY = e2.clientY - frameRect.top;

    let hoveredIcon = null;
    appIcons.forEach(icon => {
      const rect = icon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2 - frameRect.left;
      const cy = rect.top + rect.height / 2 - frameRect.top;
      const dist = Math.sqrt((pointerX - cx) ** 2 + (pointerY - cy) ** 2);
      if (dist < 30) hoveredIcon = icon;
    });

    if (currentHovered && currentHovered !== hoveredIcon) {
      currentHovered.classList.remove('hovered');
    }
    if (hoveredIcon) {
      hoveredIcon.classList.add('hovered');
    }
    currentHovered = hoveredIcon;
  };

  const onUp = (e2) => {
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);

    const dy = dragStartY - e2.clientY;

    if (currentHovered) {
      const color = currentHovered.dataset.color;
      recentsOverlay.classList.remove('visible');
      openApp(color);
      currentHovered.classList.remove('hovered');
      currentHovered = null;
      hideDock();
    } else if (dy > 300) {
      hideDock();
      goHome();
    } else if (recentsShown && dy > 60) {
      hideDock();
      dotIndicator.classList.remove('hidden');
      state = 'recents';
    } else {
      hideDock();
      recentsOverlay.classList.remove('visible');
      dotIndicator.classList.remove('hidden');
      state = wasAppOpen ? 'app-open' : 'idle';
    }
  };

  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
});

function openApp(color) {
  addToRunning(color);
  appScreen.style.background = color;
  appScreen.classList.add('open');
  dotIndicator.classList.remove('hidden');
  state = 'app-open';
}

function goHome() {
  appScreen.classList.remove('open');
  recentsOverlay.classList.remove('visible');
  dotIndicator.classList.remove('hidden');
  state = 'idle';
}

function hideDock() {
  dockContainer.classList.add('animate');
  dockContainer.classList.remove('visible');
}

function showRecents() {
  recentsCardIndex = 0;
  rebuildRecentsCards();
  updateRecentsPosition(false);
  recentsOverlay.classList.add('visible');
  dotIndicator.classList.remove('hidden');
  appScreen.classList.remove('open');
}

function hideRecents() {
  recentsOverlay.classList.remove('visible');
  dotIndicator.classList.remove('hidden');
  state = 'idle';
}

function updateRecentsPosition(animate) {
  const cardW = 280;
  const gap = 16;
  const offset = -(recentsCardIndex * (cardW + gap));
  recentsCards.style.transition = animate ? 'transform 0.3s ease' : 'none';
  recentsCards.style.transform = `translateX(${offset}px)`;
}

// Horizontal swiping + tapping in recents view
let recentsDragStartX = 0;
let recentsDragging = false;

recentsOverlay.addEventListener('pointerdown', (e) => {
  if (state !== 'recents') return;
  const card = e.target.closest('.recent-card');
  const dockIcon = e.target.closest('#recents-dock-icons .app-icon');

  recentsDragStartX = e.clientX;
  recentsDragging = true;
  recentsOverlay.setPointerCapture(e.pointerId);

  const onMove = (e2) => {
    if (!recentsDragging) return;
    const dx = e2.clientX - recentsDragStartX;
    const cardW = 280;
    const gap = 16;
    const baseOffset = -(recentsCardIndex * (cardW + gap));
    recentsCards.style.transition = 'none';
    recentsCards.style.transform = `translateX(${baseOffset + dx}px)`;
  };

  const onUp = (e2) => {
    recentsOverlay.removeEventListener('pointermove', onMove);
    recentsOverlay.removeEventListener('pointerup', onUp);
    recentsDragging = false;

    const dx = e2.clientX - recentsDragStartX;
    const cardCount = runningApps.length;

    if (Math.abs(dx) < 10) {
      if (card) {
        const color = card.dataset.color;
        hideRecents();
        openApp(color);
        return;
      }
      if (dockIcon) {
        const color = dockIcon.dataset.color;
        hideRecents();
        openApp(color);
        return;
      }
      hideRecents();
      return;
    }

    const threshold = 80;
    if (dx < -threshold && recentsCardIndex < cardCount - 1) {
      recentsCardIndex++;
    } else if (dx > threshold && recentsCardIndex > 0) {
      recentsCardIndex--;
    }
    updateRecentsPosition(true);
  };

  recentsOverlay.addEventListener('pointermove', onMove);
  recentsOverlay.addEventListener('pointerup', onUp);
});

// Init with some running apps (not from dock)
runningApps = ['#E8A87C', '#85CDCA', '#C38D9E'];
rebuildRecentsCards();
</script>

</body>
</html>
