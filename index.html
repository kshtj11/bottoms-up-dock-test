<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=540, user-scalable=no">
<title>Gesture Interaction Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #frame {
    position: relative;
    width: 540px;
    height: 620px;
    overflow: hidden;
    background: #373737;
    background: color(display-p3 0.216 0.216 0.216);
  }

  /* Home screen */
  #home-screen {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #000 url('home.png') center / cover no-repeat;
  }

  /* Dim layer behind the recents carousel */
  #recents-bg {
    position: absolute;
    inset: 0;
    z-index: 8;
    background: #000000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #recents-bg.visible {
    opacity: 0.75;
    pointer-events: auto;
  }

  /* Full-screen opened app */
  #app-screen {
    position: absolute;
    inset: 0;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #app-screen.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Recent apps preview (Frame 36) */
  #recents-preview {
    position: absolute;
    top: 113px;
    left: 0;
    width: 540px;
    height: 372px;
    z-index: 10;
    display: flex;
    justify-content: center;
    overflow: visible;
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #recents-preview.visible {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  #recents-track {
    display: flex;
    gap: 44px;
    align-items: center;
    will-change: transform;
  }
  .preview-card {
    width: 324px;
    height: 372px;
    border-radius: 4px;
    flex: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }

  /* Dock (Frame 5) */
  #dock {
    position: absolute;
    left: 50%;
    bottom: 26px; /* 16px deadzone + 10px gap */
    transform: translateX(-50%) translateY(140px);
    width: 397px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 14px 0 15px;
    background: rgba(217, 217, 217, 0.2);
    background: color(display-p3 0.851 0.851 0.851 / 0.2);
    border-radius: 40px;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
    transition: transform 0.28s cubic-bezier(0.22,1,0.36,1), opacity 0.2s ease;
  }
  #dock.revealed {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  #dock-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 36px;
    width: 368px;
    height: 64px;
  }

  .dock-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: width 0.18s cubic-bezier(0.22,1,0.36,1), height 0.18s cubic-bezier(0.22,1,0.36,1);
    position: relative;
  }
  .dock-icon.active {
    width: 64px;
    height: 64px;
  }

  /* Dock icons are bare SVG glyphs — no circle frame */
  .dock-svg {
    width: 60px;
    height: 60px;
    object-fit: contain;
    transition: transform 0.18s ease;
    pointer-events: none;
  }
  .dock-icon.active .dock-svg {
    transform: scale(1.2);
  }

  /* Deadzone (Rectangle 37) — full-width black bar, visual only */
  #deadzone {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 16px;
    background: #111111;
    background: color(display-p3 0.067 0.067 0.067);
    opacity: 0.05;
    z-index: 30;
  }

  /* Dock-fill toggle (top-right) */
  #dock-fill-toggle {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 40;
    padding: 4px 8px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }
  #frame.dock-bare #dock {
    background: transparent;
  }

  /* Active swipe-up zone — only the central 72px starts a gesture */
  #swipe-zone {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 16px;
    background: #808080;
    background: color(display-p3 0.5 0.5 0.5);
    border-radius: 8px 8px 0 0;
    opacity: 0.05;
    z-index: 31;
    cursor: grab;
  }
</style>
</head>
<body>

<div id="frame">
  <!-- Home screen (image background) -->
  <div id="home-screen"></div>

  <!-- Opened app -->
  <div id="app-screen"></div>

  <!-- Dim layer behind the recents carousel -->
  <div id="recents-bg"></div>

  <!-- Recent apps preview -->
  <div id="recents-preview">
    <div id="recents-track"></div>
  </div>

  <!-- Dock -->
  <div id="dock">
    <div id="dock-row">
      <div class="dock-icon" data-app="search">
        <svg class="dock-svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <line x1="15.5" y1="15.5" x2="21" y2="21"/>
        </svg>
      </div>
      <div class="dock-icon" data-app="green">
        <img class="dock-svg" src="icons/notes-app-icon.png" alt="">
      </div>
      <div class="dock-icon active" data-app="recent"></div>
      <div class="dock-icon" data-app="pink">
        <img class="dock-svg" src="icons/camera-app-icon.png" alt="">
      </div>
      <div class="dock-icon" data-app="purple">
        <img class="dock-svg" src="icons/music-app-icon.png" alt="">
      </div>
    </div>
  </div>

  <!-- Dock-fill visibility toggle -->
  <div id="dock-fill-toggle">Dock BG: ON</div>

  <!-- Deadzone -->
  <div id="deadzone"></div>
  <!-- Central swipe-up zone -->
  <div id="swipe-zone"></div>
</div>

<script>
const frame = document.getElementById('frame');
const swipeZone = document.getElementById('swipe-zone');
const dock = document.getElementById('dock');
const dockIcons = Array.from(document.querySelectorAll('.dock-icon'));
const appScreen = document.getElementById('app-screen');
const recentsPreview = document.getElementById('recents-preview');
const recentsTrack = document.getElementById('recents-track');
const recentsBg = document.getElementById('recents-bg');

// Show/hide the recents view (cards + dim background together)
function showRecentsView() {
  recentsPreview.classList.add('visible');
  recentsBg.classList.add('visible');
}
function hideRecentsView() {
  recentsPreview.classList.remove('visible');
  recentsBg.classList.remove('visible');
}

// App color map for full-screen open
const APP_COLORS = {
  search: '#DADADA',
  green:  '#BEDE72',
  pink:   '#FFBBBC',
  purple: '#D4B2FF'
};

// Recent apps stack — index 0 is most recent (shown in middle of preview).
// Entries are opaque "app keys": either an image path (image-backed app)
// or a hex color (dock-launched app).
let recents = ['recents/1.png', 'recents/2.png', 'recents/3.png'];
// Key of the app currently in the foreground (null when on home)
let currentApp = null;

// Build a CSS background value for an app key (image or hex color)
function appBg(key) {
  if (typeof key === 'string' && key.endsWith('.png')) {
    return `#000 url('${key}') center / cover no-repeat`;
  }
  return key;
}

const CARD_W = 324, CARD_GAP = 44, CARD_STEP = CARD_W + CARD_GAP; // 368
let recentsCards = [];   // colors laid out left->right (oldest -> newest)
let recentsIndex = 0;    // index of the currently centered card

function buildRecentsPreview() {
  recentsTrack.innerHTML = '';
  // Exclude the app you're currently in — don't show it in its own recents
  recentsCards = recents.filter(c => c !== currentApp).reverse(); // rightmost = most recent
  recentsCards.forEach((key) => {
    const card = document.createElement('div');
    card.className = 'preview-card';
    card.style.background = appBg(key);
    card.dataset.appKey = key;
    recentsTrack.appendChild(card);
  });
  recentsIndex = recentsCards.length - 1; // start on most recent (centered)
  setRecentsOffset(offsetForIndex(recentsIndex), false);
}

function offsetForIndex(i) {
  const N = recentsCards.length;
  return -(i - (N - 1) / 2) * CARD_STEP;
}

function setRecentsOffset(px, animate) {
  recentsTrack.style.transition = animate
    ? 'transform 0.28s cubic-bezier(0.22,1,0.36,1)'
    : 'none';
  recentsTrack.style.transform = `translateX(${px}px)`;
}

const RECENT_INDEX = 2; // center cyan icon position in dockIcons

const FRAME_H = 620;
const DEADZONE_H = 16;

let gestureFrameRect = null; // frame rect cached for the duration of a drag
let dragging = false;
let revealed = false;
let recentsLatched = false; // recents view kept open after release
let activeIndex = RECENT_INDEX;
let startY = 0;
let lastY = 0;
let crossedMiddle = false;
// Velocity tracking for quick-flick-to-home
let prevY = 0, prevT = 0, velocity = 0;
const FLICK_VELOCITY = 0.9; // px/ms upward = quick flick → home

function setActive(index) {
  if (index === activeIndex) return;
  dockIcons[activeIndex].classList.remove('active');
  dockIcons[index].classList.add('active');
  activeIndex = index;

  // Recents preview only shows when the recent (center) icon is active
  if (activeIndex === RECENT_INDEX) {
    showRecentsView();
  } else {
    hideRecentsView();
  }
}

function nearestIconIndex(pointerX) {
  let best = 0;
  let bestDist = Infinity;
  dockIcons.forEach((icon, i) => {
    const r = icon.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const d = Math.abs(pointerX - cx);
    if (d < bestDist) { bestDist = d; best = i; }
  });
  return best;
}

swipeZone.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  dragging = true;
  revealed = false;
  recentsLatched = false;
  crossedMiddle = false;
  startY = e.clientY;
  lastY = e.clientY;
  prevY = e.clientY;
  prevT = performance.now();
  velocity = 0;
  gestureFrameRect = frame.getBoundingClientRect(); // frame doesn't move mid-drag

  // Reset active to center (recent) by default
  dockIcons.forEach(ic => ic.classList.remove('active'));
  activeIndex = RECENT_INDEX;
  dockIcons[RECENT_INDEX].classList.add('active');

  buildRecentsPreview();
  frame.setPointerCapture(e.pointerId);

  const onMove = (e2) => {
    if (!dragging) return;
    lastY = e2.clientY;

    // Track instantaneous upward velocity (px/ms)
    const now = performance.now();
    const dt = now - prevT;
    if (dt > 0) {
      velocity = (prevY - e2.clientY) / dt;
      prevT = now;
      prevY = e2.clientY;
    }

    const dy = startY - e2.clientY;

    if (dy > 8 && !revealed) {
      revealed = true;
      dock.classList.add('revealed');
      showRecentsView();
    }

    // Did the swipe reach past the middle of the screen?
    if ((e2.clientY - gestureFrameRect.top) < FRAME_H / 2) crossedMiddle = true;

    if (revealed) {
      const idx = nearestIconIndex(e2.clientX);
      setActive(idx);
    }
  };

  const onUp = (e2) => {
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    dragging = false;

    // A quick upward flick goes home, regardless of swipe length.
    // Ignore a stale velocity if the finger paused before releasing.
    const sinceLastMove = performance.now() - prevT;
    const flickVel = sinceLastMove > 80 ? 0 : velocity;
    if (flickVel > FLICK_VELOCITY) {
      goHome();
      return;
    }

    const onRecentIcon = activeIndex === RECENT_INDEX;

    if (revealed && (onRecentIcon || crossedMiddle)) {
      // Keep the recent apps view open
      latchRecents();
    } else if (revealed) {
      openActive();
      collapseDock();
    } else {
      collapseDock();
    }
  };

  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
});

function collapseDock() {
  dock.classList.remove('revealed');
  if (!recentsLatched) hideRecentsView();
}

function goHome() {
  recentsLatched = false;
  currentApp = null;
  appScreen.classList.remove('open');
  hideRecentsView();
  dock.classList.remove('revealed');
}

function latchRecents() {
  recentsLatched = true;
  dock.classList.add('revealed'); // dock stays persistent on recents
  showRecentsView();
}

function unlatchRecents() {
  recentsLatched = false;
  hideRecentsView();
  dock.classList.remove('revealed');
}

function openActive() {
  const app = dockIcons[activeIndex].dataset.app;
  if (app === 'recent') return; // handled by latchRecents
  openApp(APP_COLORS[app]);
}

function openApp(key) {
  currentApp = key;
  // Move to the front of the recents stack (most recent)
  recents = recents.filter(c => c !== key);
  recents.unshift(key);
  appScreen.style.background = appBg(key);
  appScreen.classList.add('open');
}

// Horizontal swipe + tap on the latched recents carousel
let rDragging = false, rStartX = 0, rBaseOffset = 0, rMoved = false, rStartTarget = null;

recentsPreview.addEventListener('pointerdown', (e) => {
  if (!recentsLatched) return;
  rDragging = true;
  rMoved = false;
  rStartX = e.clientX;
  rStartTarget = e.target; // captured here — pointer capture retargets later events
  rBaseOffset = offsetForIndex(recentsIndex);
  recentsPreview.setPointerCapture(e.pointerId);
});

recentsPreview.addEventListener('pointermove', (e) => {
  if (!rDragging) return;
  const dx = e.clientX - rStartX;
  if (Math.abs(dx) > 8) rMoved = true;
  setRecentsOffset(rBaseOffset + dx, false);
});

recentsPreview.addEventListener('pointerup', (e) => {
  if (!rDragging) return;
  rDragging = false;
  const dx = e.clientX - rStartX;

  if (!rMoved) {
    // It was a tap, not a swipe → open the tapped card's app
    const card = rStartTarget && rStartTarget.closest('.preview-card');
    if (card) {
      unlatchRecents();
      openApp(card.dataset.appKey);
    }
    return;
  }

  // Snap to the nearest card (a decisive flick advances one card)
  let delta = Math.round(-dx / CARD_STEP);
  if (delta === 0 && Math.abs(dx) > CARD_STEP * 0.22) delta = dx < 0 ? 1 : -1;
  recentsIndex = Math.max(0, Math.min(recentsCards.length - 1, recentsIndex + delta));
  setRecentsOffset(offsetForIndex(recentsIndex), true);
});

// Tap outside the carousel/dock (while latched) to dismiss to home
frame.addEventListener('pointerdown', (e) => {
  if (!recentsLatched || dragging) return;
  if (e.target.closest('#recents-preview')) return; // carousel handles its own input
  if (e.target.closest('#dock')) return;            // dock is persistent
  if (e.target.closest('#deadzone')) return;         // deadzone starts a new gesture
  unlatchRecents();
});

// While the recents view is latched, tapping a dock icon launches that app
dockIcons.forEach((icon) => {
  icon.addEventListener('pointerdown', (e) => {
    if (!recentsLatched) return;
    const app = icon.dataset.app;
    if (app === 'recent') return; // already on recents — nothing to do
    e.stopPropagation();
    unlatchRecents();
    openApp(APP_COLORS[app]);
  });
});

// Top-right toggle for dock background fill
const dockFillToggle = document.getElementById('dock-fill-toggle');
dockFillToggle.addEventListener('pointerdown', (e) => {
  e.stopPropagation(); // don't trigger frame-level dismiss/hit handlers
  const on = frame.classList.toggle('dock-bare');
  dockFillToggle.textContent = on ? 'Dock BG: OFF' : 'Dock BG: ON';
});

buildRecentsPreview();
</script>

</body>
</html>
