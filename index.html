<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=540, user-scalable=no">
<title>Gesture Interaction Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #frame {
    position: relative;
    width: 540px;
    height: 620px;
    overflow: hidden;
    background: #373737;
    background: color(display-p3 0.216 0.216 0.216);
  }

  /* Home screen */
  #home-screen {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .home-icon {
    position: absolute;
    width: 56px;
    height: 56px;
    background: #D9D9D9;
    background: color(display-p3 0.851 0.851 0.851);
    border-radius: 8px;
  }
  #home-label {
    position: absolute;
    width: 276px;
    left: 136px;
    top: 496px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 19px;
    text-align: center;
    color: #FFFFFF;
  }

  /* Full-screen opened app */
  #app-screen {
    position: absolute;
    inset: 0;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #app-screen.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Recent apps preview (Frame 36) */
  #recents-preview {
    position: absolute;
    top: 113px;
    left: 0;
    width: 540px;
    height: 372px;
    z-index: 10;
    display: flex;
    justify-content: center;
    overflow: visible;
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #recents-preview.visible {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  #recents-track {
    display: flex;
    gap: 44px;
    align-items: center;
    will-change: transform;
  }
  .preview-card {
    width: 324px;
    height: 372px;
    border-radius: 22px;
    flex: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }

  /* Dock (Frame 5) */
  #dock {
    position: absolute;
    left: 50%;
    bottom: 26px; /* 16px deadzone + 10px gap */
    transform: translateX(-50%) translateY(140px);
    width: 349px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 14px 0 15px;
    background: rgba(217, 217, 217, 0.2);
    background: color(display-p3 0.851 0.851 0.851 / 0.2);
    border-radius: 40px;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
    transition: transform 0.28s cubic-bezier(0.22,1,0.36,1), opacity 0.2s ease;
  }
  #dock.revealed {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  #dock-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 24px;
    width: 320px;
    height: 64px;
  }

  .dock-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: width 0.18s cubic-bezier(0.22,1,0.36,1), height 0.18s cubic-bezier(0.22,1,0.36,1);
    position: relative;
  }
  .dock-icon.active {
    width: 64px;
    height: 64px;
  }

  .icon-search { background: #DADADA; background: color(display-p3 0.855 0.855 0.855); }
  .icon-green  { background: #BEDE72; background: color(display-p3 0.769 0.867 0.498); }
  .icon-cyan   { background: #74FFEE; background: color(display-p3 0.604 1.000 0.933); }
  .icon-pink   { background: #FFBBBC; background: color(display-p3 1.000 0.745 0.745); }
  .icon-purple { background: #D4B2FF; background: color(display-p3 0.812 0.702 1.000); }

  .search-svg {
    width: 22px;
    height: 22px;
    transition: transform 0.18s ease;
  }
  .dock-icon.active .search-svg {
    transform: scale(1.3);
  }

  /* Deadzone (Rectangle 37) — full-width black bar, visual only */
  #deadzone {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 16px;
    background: #111111;
    background: color(display-p3 0.067 0.067 0.067);
    opacity: 0.05;
    z-index: 30;
  }

  /* Active swipe-up zone — only the central 72px starts a gesture */
  #swipe-zone {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 16px;
    background: #808080;
    background: color(display-p3 0.5 0.5 0.5);
    border-radius: 8px 8px 0 0;
    opacity: 0.05;
    z-index: 31;
    cursor: grab;
  }
</style>
</head>
<body>

<div id="frame">
  <!-- Home screen (icons generated in JS) -->
  <div id="home-screen">
    <div id="home-label">home screen with something and all</div>
  </div>

  <!-- Opened app -->
  <div id="app-screen"></div>

  <!-- Recent apps preview -->
  <div id="recents-preview">
    <div id="recents-track"></div>
  </div>

  <!-- Dock -->
  <div id="dock">
    <div id="dock-row">
      <div class="dock-icon icon-search" data-app="search">
        <svg class="search-svg" viewBox="0 0 22 22" fill="none">
          <circle cx="9.5" cy="9.5" r="7" stroke="white" stroke-width="2" fill="none"/>
          <line x1="14.5" y1="14.5" x2="20" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="dock-icon icon-green" data-app="green"></div>
      <div class="dock-icon icon-cyan active" data-app="recent"></div>
      <div class="dock-icon icon-pink" data-app="pink"></div>
      <div class="dock-icon icon-purple" data-app="purple"></div>
    </div>
  </div>

  <!-- Deadzone -->
  <div id="deadzone"></div>
  <!-- Central swipe-up zone -->
  <div id="swipe-zone"></div>
</div>

<script>
const frame = document.getElementById('frame');
const swipeZone = document.getElementById('swipe-zone');
const dock = document.getElementById('dock');
const dockIcons = Array.from(document.querySelectorAll('.dock-icon'));
const appScreen = document.getElementById('app-screen');
const recentsPreview = document.getElementById('recents-preview');
const recentsTrack = document.getElementById('recents-track');

// Build the 4×4 home-icon grid (cols at x, rows at y)
(() => {
  const homeScreen = document.getElementById('home-screen');
  const label = document.getElementById('home-label');
  const frag = document.createDocumentFragment();
  for (const top of [88, 193, 294, 399]) {
    for (const left of [78, 187, 296, 405]) {
      const icon = document.createElement('div');
      icon.className = 'home-icon';
      icon.style.left = left + 'px';
      icon.style.top = top + 'px';
      frag.appendChild(icon);
    }
  }
  homeScreen.insertBefore(frag, label);
})();

// App color map for full-screen open
const APP_COLORS = {
  search: '#DADADA',
  green:  '#BEDE72',
  pink:   '#FFBBBC',
  purple: '#D4B2FF'
};

// Recent apps stack — index 0 is most recent (shown in middle of preview)
let recents = ['#E8A87C', '#85CDCA', '#C38D9E'];
// Color of the app currently in the foreground (null when on home)
let currentApp = null;

const CARD_W = 324, CARD_GAP = 44, CARD_STEP = CARD_W + CARD_GAP; // 368
let recentsCards = [];   // colors laid out left->right (oldest -> newest)
let recentsIndex = 0;    // index of the currently centered card

function buildRecentsPreview() {
  recentsTrack.innerHTML = '';
  // Exclude the app you're currently in — don't show it in its own recents
  recentsCards = recents.filter(c => c !== currentApp).reverse(); // rightmost = most recent
  recentsCards.forEach((color) => {
    const card = document.createElement('div');
    card.className = 'preview-card';
    card.style.background = color;
    card.dataset.color = color;
    recentsTrack.appendChild(card);
  });
  recentsIndex = recentsCards.length - 1; // start on most recent (centered)
  setRecentsOffset(offsetForIndex(recentsIndex), false);
}

function offsetForIndex(i) {
  const N = recentsCards.length;
  return -(i - (N - 1) / 2) * CARD_STEP;
}

function setRecentsOffset(px, animate) {
  recentsTrack.style.transition = animate
    ? 'transform 0.28s cubic-bezier(0.22,1,0.36,1)'
    : 'none';
  recentsTrack.style.transform = `translateX(${px}px)`;
}

const RECENT_INDEX = 2; // center cyan icon position in dockIcons

const FRAME_H = 620;
const DEADZONE_H = 16;

let gestureFrameRect = null; // frame rect cached for the duration of a drag
let dragging = false;
let revealed = false;
let recentsLatched = false; // recents view kept open after release
let activeIndex = RECENT_INDEX;
let startY = 0;
let lastY = 0;
let crossedMiddle = false;
// Velocity tracking for quick-flick-to-home
let prevY = 0, prevT = 0, velocity = 0;
const FLICK_VELOCITY = 0.9; // px/ms upward = quick flick → home

function setActive(index) {
  if (index === activeIndex) return;
  dockIcons[activeIndex].classList.remove('active');
  dockIcons[index].classList.add('active');
  activeIndex = index;

  // Recents preview only shows when the recent (center) icon is active
  if (activeIndex === RECENT_INDEX) {
    recentsPreview.classList.add('visible');
  } else {
    recentsPreview.classList.remove('visible');
  }
}

function nearestIconIndex(pointerX) {
  let best = 0;
  let bestDist = Infinity;
  dockIcons.forEach((icon, i) => {
    const r = icon.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const d = Math.abs(pointerX - cx);
    if (d < bestDist) { bestDist = d; best = i; }
  });
  return best;
}

swipeZone.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  dragging = true;
  revealed = false;
  recentsLatched = false;
  crossedMiddle = false;
  startY = e.clientY;
  lastY = e.clientY;
  prevY = e.clientY;
  prevT = performance.now();
  velocity = 0;
  gestureFrameRect = frame.getBoundingClientRect(); // frame doesn't move mid-drag

  // Reset active to center (recent) by default
  dockIcons.forEach(ic => ic.classList.remove('active'));
  activeIndex = RECENT_INDEX;
  dockIcons[RECENT_INDEX].classList.add('active');

  buildRecentsPreview();
  frame.setPointerCapture(e.pointerId);

  const onMove = (e2) => {
    if (!dragging) return;
    lastY = e2.clientY;

    // Track instantaneous upward velocity (px/ms)
    const now = performance.now();
    const dt = now - prevT;
    if (dt > 0) {
      velocity = (prevY - e2.clientY) / dt;
      prevT = now;
      prevY = e2.clientY;
    }

    const dy = startY - e2.clientY;

    if (dy > 8 && !revealed) {
      revealed = true;
      dock.classList.add('revealed');
      recentsPreview.classList.add('visible');
    }

    // Did the swipe reach past the middle of the screen?
    if ((e2.clientY - gestureFrameRect.top) < FRAME_H / 2) crossedMiddle = true;

    if (revealed) {
      const idx = nearestIconIndex(e2.clientX);
      setActive(idx);
    }
  };

  const onUp = (e2) => {
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    dragging = false;

    // A quick upward flick goes home, regardless of swipe length.
    // Ignore a stale velocity if the finger paused before releasing.
    const sinceLastMove = performance.now() - prevT;
    const flickVel = sinceLastMove > 80 ? 0 : velocity;
    if (flickVel > FLICK_VELOCITY) {
      goHome();
      return;
    }

    const onRecentIcon = activeIndex === RECENT_INDEX;

    if (revealed && (onRecentIcon || crossedMiddle)) {
      // Keep the recent apps view open
      latchRecents();
    } else if (revealed) {
      openActive();
      collapseDock();
    } else {
      collapseDock();
    }
  };

  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
});

function collapseDock() {
  dock.classList.remove('revealed');
  if (!recentsLatched) recentsPreview.classList.remove('visible');
}

function goHome() {
  recentsLatched = false;
  currentApp = null;
  appScreen.classList.remove('open');
  recentsPreview.classList.remove('visible');
  dock.classList.remove('revealed');
}

function latchRecents() {
  recentsLatched = true;
  dock.classList.add('revealed'); // dock stays persistent on recents
  recentsPreview.classList.add('visible');
}

function unlatchRecents() {
  recentsLatched = false;
  recentsPreview.classList.remove('visible');
  dock.classList.remove('revealed');
}

function openActive() {
  const app = dockIcons[activeIndex].dataset.app;
  if (app === 'recent') return; // handled by latchRecents
  openApp(APP_COLORS[app]);
}

function openApp(color) {
  currentApp = color;
  // Move to the front of the recents stack (most recent)
  recents = recents.filter(c => c !== color);
  recents.unshift(color);
  appScreen.style.background = color;
  appScreen.classList.add('open');
}

// Tap on opened app to go home (ignore taps in the bottom deadzone)
appScreen.addEventListener('pointerdown', (e) => {
  const yInFrame = e.clientY - frame.getBoundingClientRect().top;
  if (yInFrame < FRAME_H - DEADZONE_H) {
    appScreen.classList.remove('open');
    currentApp = null;
  }
});

// Horizontal swipe + tap on the latched recents carousel
let rDragging = false, rStartX = 0, rBaseOffset = 0, rMoved = false, rStartTarget = null;

recentsPreview.addEventListener('pointerdown', (e) => {
  if (!recentsLatched) return;
  rDragging = true;
  rMoved = false;
  rStartX = e.clientX;
  rStartTarget = e.target; // captured here — pointer capture retargets later events
  rBaseOffset = offsetForIndex(recentsIndex);
  recentsPreview.setPointerCapture(e.pointerId);
});

recentsPreview.addEventListener('pointermove', (e) => {
  if (!rDragging) return;
  const dx = e.clientX - rStartX;
  if (Math.abs(dx) > 8) rMoved = true;
  setRecentsOffset(rBaseOffset + dx, false);
});

recentsPreview.addEventListener('pointerup', (e) => {
  if (!rDragging) return;
  rDragging = false;
  const dx = e.clientX - rStartX;

  if (!rMoved) {
    // It was a tap, not a swipe → open the tapped card's app
    const card = rStartTarget && rStartTarget.closest('.preview-card');
    if (card) {
      unlatchRecents();
      openApp(card.dataset.color);
    }
    return;
  }

  // Snap to the nearest card (a decisive flick advances one card)
  let delta = Math.round(-dx / CARD_STEP);
  if (delta === 0 && Math.abs(dx) > CARD_STEP * 0.22) delta = dx < 0 ? 1 : -1;
  recentsIndex = Math.max(0, Math.min(recentsCards.length - 1, recentsIndex + delta));
  setRecentsOffset(offsetForIndex(recentsIndex), true);
});

// Tap outside the carousel/dock (while latched) to dismiss to home
frame.addEventListener('pointerdown', (e) => {
  if (!recentsLatched || dragging) return;
  if (e.target.closest('#recents-preview')) return; // carousel handles its own input
  if (e.target.closest('#dock')) return;            // dock is persistent
  if (e.target.closest('#deadzone')) return;         // deadzone starts a new gesture
  unlatchRecents();
});

buildRecentsPreview();
</script>

</body>
</html>
